name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Reproductibilité du rapport (graine 42)
        # réentraîne et compare à reports/synthetique-42.json ; seuls trainedAt et ms peuvent changer
        run: npm run check:repro
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # job séparé : un échec Docker ne bloque pas la publication de la démo en ligne
  docker:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Images Docker construites (web et eval), eval exécutée
        run: |
          docker build -t fidelia .
          docker build --target eval -t fidelia-eval .
          docker run --rm fidelia-eval

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
