<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4a44"/>
    </marker>
    <style>
      .b{fill:#f4f7f5;stroke:#1b6b45;stroke-width:1.4}
      .s{fill:#ffffff;stroke:#9aa8a1;stroke-width:1.2}
      .h{fill:#fff6dc;stroke:#c99a1e;stroke-width:1.4}
      .t{fill:#14251d;font-weight:600}
      .n{fill:#4c5a53;font-size:11.5px}
      .l{stroke:#3d4a44;stroke-width:1.4;fill:none;marker-end:url(#a)}
      .d{stroke:#3d4a44;stroke-width:1.2;fill:none;stroke-dasharray:5 4;marker-end:url(#a)}
    </style>
  </defs>
  <!-- sources -->
  <rect class="s" x="20" y="16" width="220" height="44" rx="8"/>
  <text class="t" x="130" y="36" text-anchor="middle">CRM / plateforme de dons</text>
  <text class="n" x="130" y="51" text-anchor="middle">export CSV</text>
  <rect class="s" x="20" y="72" width="220" height="44" rx="8"/>
  <text class="t" x="130" y="92" text-anchor="middle">Outil de courriels</text>
  <text class="n" x="130" y="107" text-anchor="middle">ouvertures</text>
  <rect class="b" x="300" y="40" width="280" height="50" rx="8"/>
  <text class="t" x="440" y="61" text-anchor="middle">Import et contrôles de qualité</text>
  <text class="n" x="440" y="77" text-anchor="middle">complétude, doublons, cohérence, consentement</text>
  <path class="l" d="M240,38 L298,58"/>
  <path class="l" d="M240,94 L298,74"/>
  <!-- features -->
  <rect class="b" x="250" y="122" width="380" height="40" rx="8"/>
  <text class="t" x="440" y="147" text-anchor="middle">Calcul des 18 variables à la date d’analyse</text>
  <path class="l" d="M440,90 L440,120"/>
  <!-- three branches -->
  <rect class="b" x="20" y="200" width="230" height="88" rx="8"/>
  <text class="t" x="135" y="222" text-anchor="middle">Entraînement (trimestriel)</text>
  <text class="n" x="135" y="240" text-anchor="middle">photos tous les 2 à 6 mois</text>
  <text class="n" x="135" y="255" text-anchor="middle">réglage sur validation, test unique</text>
  <text class="n" x="135" y="270" text-anchor="middle">audit d’équité, requis R1 à R6</text>
  <rect class="b" x="300" y="200" width="200" height="88" rx="8"/>
  <text class="t" x="400" y="222" text-anchor="middle">Scoring (hebdomadaire)</text>
  <text class="n" x="400" y="242" text-anchor="middle">4 modèles ou repli RFM</text>
  <text class="n" x="400" y="258" text-anchor="middle">+ 3 raisons par donateur</text>
  <rect class="s" x="550" y="200" width="190" height="88" rx="8"/>
  <text class="t" x="645" y="222" text-anchor="middle">Règle « remercier »</text>
  <text class="n" x="645" y="242" text-anchor="middle">sans IA : premier don,</text>
  <text class="n" x="645" y="258" text-anchor="middle">don inhabituel, anniversaire</text>
  <path class="l" d="M380,162 L150,198"/>
  <path class="l" d="M420,162 L400,198"/>
  <path class="l" d="M500,162 L640,198"/>
  <!-- model.json -->
  <rect class="h" x="55" y="312" width="160" height="34" rx="17"/>
  <text class="t" x="135" y="333" text-anchor="middle">model.json versionné</text>
  <path class="l" d="M135,288 L135,310"/>
  <path class="l" d="M200,329 L320,290"/>
  <!-- decision -->
  <rect class="b" x="250" y="330" width="380" height="40" rx="8"/>
  <text class="t" x="440" y="355" text-anchor="middle">Choix de l’action : valeur attendue, garde-fous</text>
  <path class="l" d="M400,288 L420,328"/>
  <path class="l" d="M645,288 L560,328"/>
  <!-- emails -->
  <rect class="b" x="250" y="398" width="380" height="40" rx="8"/>
  <text class="t" x="440" y="423" text-anchor="middle">Brouillons de courriels → validation humaine → envoi</text>
  <path class="l" d="M440,370 L440,396"/>
  <!-- results -->
  <rect class="b" x="250" y="466" width="380" height="40" rx="8"/>
  <text class="t" x="440" y="491" text-anchor="middle">Résultats et groupe témoin de 10 %</text>
  <path class="l" d="M440,438 L440,464"/>
  <path class="d" d="M250,486 L60,486 L60,290"/>
  <text class="n" x="66" y="530">rétroaction : nouvelles étiquettes pour le réentraînement</text>
</svg>
